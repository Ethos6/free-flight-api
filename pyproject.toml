[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "free-flight-api"
version = "1.0.0"
description = "Free, self-hosted live flight tracking API. Merges adsb.lol, airplanes.live, adsb.fi and OpenSky; routes, aircraft photos, live map, SSE stream, OpenSky/ADSBx-compatible endpoints, MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ethos6" }]
keywords = ["flight-tracker", "ads-b", "adsb", "aviation", "flight-api", "opensky", "flightradar", "aircraft", "mcp", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mcp>=1.10"]

[project.scripts]
freeflight = "freeflight.cli:main"

[project.urls]
Homepage = "https://github.com/Ethos6/free-flight-api"
Issues = "https://github.com/Ethos6/free-flight-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["freeflight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
