name: Provider health

# Queries every data network once from a GitHub runner and posts a table in the job summary.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Check providers
        run: freeflight check | tee -a "$GITHUB_STEP_SUMMARY"
